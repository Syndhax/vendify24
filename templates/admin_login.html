{% extends 'base.html' %}

{% block title %}Admin Portal Sign In - Vendify24{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 bg-white">
    <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-black text-white flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-black font-['Plus_Jakarta_Sans']">Platform Owner Portal</h1>
        <p class="text-black/60 text-xs mt-1">Sign in to manage vendor submissions & deliver website links</p>
    </div>

    <div class="p-8 rounded-3xl bg-white border border-black/20 shadow-lg">
        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-black mb-2">
                    Admin Password
                </label>
                <input type="password" name="password" required placeholder="Enter password (default: admin123)" class="w-full px-4 py-3 rounded-xl bg-white border border-black/20 text-black placeholder-black/40 text-sm focus:outline-none focus:border-black transition shadow-sm">
                <span class="text-[11px] text-black/60 mt-1 block">Default password: <code class="text-black font-bold">admin123</code></span>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl text-white font-bold text-sm bg-black hover:bg-neutral-800 transition shadow-md shadow-black/20 border border-black">
                Sign In to Dashboard
            </button>
        </form>
    </div>
</div>
{% endblock %}
