<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian Black) -->
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Clean Monochrome Glow -->
    <filter id="cleanTechGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="500" height="500" rx="112" fill="url(#minBg)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- 
    ARCHITECTURAL MINIMALIST "24-V" LOGO IN PURE BLACK & WHITE
  -->
  <g transform="translate(20, 15)" filter="url(#cleanTechGlow)">
    <!-- 1. The Number 2 Spine and Arch -->
    <path d="M 105 150 
             C 105 85, 145 60, 205 60 
             C 265 60, 285 95, 275 140 
             C 265 185, 220 245, 125 350" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="30" 
          stroke-linecap="square" 
          stroke-miterlimit="10" />

    <!-- 2. The Center V-Apex -->
    <path d="M 125 350 
             L 345 75" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="30" 
          stroke-linecap="square" 
          stroke-miterlimit="10" />

    <!-- 3. The 4's Vertical Downstem -->
    <path d="M 345 75 
             L 345 415" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="30" 
          stroke-linecap="square" 
          stroke-miterlimit="10" />

    <!-- 4. The Horizontal Crossbar -->
    <path d="M 125 350 
             L 395 350" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="30" 
          stroke-linecap="square" 
          stroke-miterlimit="10" />

    <!-- Sharp Tech Accent Pin at V Apex -->
    <circle cx="125" cy="350" r="7" fill="#ffffff" />
    <circle cx="345" cy="75" r="7" fill="#ffffff" />
  </g>
</svg>
