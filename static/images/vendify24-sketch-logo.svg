<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Emerald / Cyan Gradient for the 24-V Ligature -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Electric Cyan Highlight -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonSpread" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect width="500" height="500" rx="110" fill="url(#badgeDark)" stroke="#1E293B" stroke-width="3" />

  <!-- Background Accent Ring -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#10B981" stroke-opacity="0.08" stroke-width="2" />

  <!-- 
    THE EXACT 24-V DESIGN FROM USER SKETCH:
    - The '2' on the left curves down diagonally to the bottom.
    - From the bottom vertex, it shoots up diagonally to form the peak of the '4', creating the bold 'V'!
    - The vertical stem of the '4' drops straight down.
    - The horizontal baseline links the '2' and '4' across.
  -->
  <g id="vendify24SketchMark" filter="url(#neonSpread)" transform="translate(10, 0)">
    
    <!-- Outer Glow Underlayer -->
    <path d="M 130 115 
             C 130 75, 175 60, 215 65 
             C 245 70, 255 100, 245 140 
             C 235 180, 195 240, 135 315 
             L 345 105 
             L 355 350 
             M 135 315 
             L 375 315" 
          fill="none" 
          stroke="url(#emeraldGlow)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.3" />

    <!-- Main Solid Crisp Line -->
    <!-- 1. The Head of the '2' curving into the diagonal spine -->
    <!-- 2. The central 'V' formed by spine of 2 going down-left, and diagonal of 4 going up-right -->
    <!-- 3. The vertical spine of the '4' dropping down -->
    <!-- 4. The connecting horizontal crossbar of 2 and 4 with crossbar tip -->
    <path d="M 130 115 
             C 130 75, 175 60, 215 65 
             C 245 70, 255 100, 245 140 
             C 235 180, 195 240, 135 315 
             L 345 105 
             L 355 350 
             M 135 315 
             L 380 315" 
          fill="none" 
          stroke="url(#emeraldGlow)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Highlight stroke on the central V apex to accentuate the 'V' of Vendify -->
    <path d="M 235 190 
             L 135 315 
             L 245 208" 
          fill="none" 
          stroke="url(#cyanAccent)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Corner Nexus Accent Dot -->
    <circle cx="135" cy="315" r="7" fill="#F0FDF4" />
    <circle cx="345" cy="105" r="6" fill="#F0FDF4" />
  </g>
</svg>
